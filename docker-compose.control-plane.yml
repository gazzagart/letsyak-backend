# =============================================================================
#  LetsYak Shared Control Plane
#  Runs the workspace discovery / tenant router as its own Compose project.
# =============================================================================

services:
  control-plane:
    build: ./control-plane
    container_name: ${CONTROL_PLANE_STACK_NAME:-letsyak-control-plane}
    restart: unless-stopped
    environment:
      PORT: "8085"
      TENANT_CONFIG_PATH: "/config/tenants.json"
      CORS_ALLOWED_ORIGINS: "${CONTROL_PLANE_CORS_ALLOWED_ORIGINS:-*}"
    volumes:
      - ${CONTROL_PLANE_TENANT_CONFIG:-./control-plane/config/tenants.sample.json}:/config/tenants.json:ro
    expose:
      - "8085"
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${CONTROL_PLANE_HTTP_PORT:-8085}:8085"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy-network}